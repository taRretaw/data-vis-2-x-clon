<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grampians Test Map</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { margin: 20px; font-family: sans-serif; }
    #map { border: 2px solid #333; margin: 20px 0; }
    .info { padding: 10px; background: #f5f5f5; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Grampians Minimal Test</h1>
  <div class="info">
    <strong>Testing:</strong> Minimal Grampians map with elevation polygons, GPT trail (red), peaks (black dots)
  </div>
  
  <div id="map"></div>
  
  <div class="info">
    <strong>Debug:</strong> Check browser console for errors. If map is blank, likely CORS issue loading local JSON.
  </div>

  <script>
    const embedOptions = {
      actions: false,
      mode: "vega-lite",
      config: { background: 'white' }
    };

    vegaEmbed('#map', 'grampians_test.vg.json', embedOptions)
      .then(result => console.log('✓ Map loaded successfully'))
      .catch(err => {
        console.error('✗ Map failed to load:', err);
        document.getElementById('map').innerHTML = '<pre style="color:red;">Error: ' + err.message + '</pre>';
      });
  </script>
</body>
</html>
